<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent to Figma</title>
    <style>
      :root {
        color-scheme: dark;
      }

      /* Dark-mode slim scrollbars matching Figma Desktop */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.3);
      }

      ::-webkit-scrollbar-thumb:active {
        background-color: rgba(255, 255, 255, 0.42);
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      ::-webkit-scrollbar-button {
        display: none;
        width: 0;
        height: 0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #e0e0e0;
        background-color: #1e1e1e;
      }

      .container {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      h2 {
        font-size: 12.5px;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: #ffffff;
      }

      p {
        margin: 0 0 8px 0;
        font-size: 11.5px;
        line-height: 1.5;
        color: #c2c2c2;
      }

      p:last-child {
        margin-bottom: 0;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10.5px;
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 4px;
        border-radius: 4px;
        color: #f0f0f0;
      }

      .hidden {
        display: none !important;
      }

      /* Top bar: brand, status, language switch, hide and collapse */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        background: #181818;
        border-bottom: 1px solid #2e2e2e;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .brand {
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #666666;
        flex: 0 0 auto;
      }

      .status-dot.connected {
        background: #4ade80;
        box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.16);
      }

      .status-dot.waiting {
        background: #f6c46a;
        box-shadow: 0 0 0 3px rgba(246, 196, 106, 0.16);
      }

      .status-dot.disconnected {
        background: #ff6b6b;
      }

      .collapsed-status {
        display: none;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e5e5e5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 2px 5px;
        border-radius: 4px;
      }

      .collapsed-status.copyable {
        cursor: pointer;
      }

      .collapsed-status.copyable:hover {
        background: #2e2e2e;
        color: #ffffff;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
      }

      .lang-switch {
        display: flex;
        gap: 2px;
        background: #2a2a2a;
        border-radius: 6px;
        padding: 2px;
      }

      .lang-btn {
        border: none;
        background: transparent;
        color: #aaaaaa;
        padding: 2px 6px;
        margin: 0;
        font-size: 11px;
        line-height: 16px;
        border-radius: 4px;
        cursor: pointer;
      }

      .lang-btn:hover {
        background: #333333;
      }

      .lang-btn.active {
        background: #3a3a3a;
        color: #ffffff;
      }

      .hide-btn {
        border: none;
        background: #2a2a2a;
        color: #d4d4d4;
        padding: 3px 7px;
        margin: 0;
        font-size: 11px;
        line-height: 16px;
        border-radius: 4px;
        white-space: nowrap;
        cursor: pointer;
      }

      .hide-btn:hover {
        background: #3a3a3a;
        color: #ffffff;
      }

      .icon-btn {
        border: none;
        background: transparent;
        color: #cccccc;
        padding: 2px 6px;
        margin: 0;
        font-size: 15px;
        line-height: 16px;
        border-radius: 4px;
        cursor: pointer;
      }

      .icon-btn:hover {
        background: #333333;
      }

      body.collapsed .tabs,
      body.collapsed .tab-body,
      body.collapsed .brand,
      body.collapsed .lang-switch {
        display: none;
      }

      body.collapsed .topbar {
        padding: 9px 10px;
        border-bottom: none;
      }

      body.collapsed .collapsed-status {
        display: inline;
      }

      /* 3 Tabs */
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid #333333;
        padding: 4px 12px 0;
        background: #1e1e1e;
      }

      .tab {
        padding: 8px 12px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 500;
        color: #999999;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
        user-select: none;
      }

      .tab:hover {
        color: #e5e5e5;
      }

      .tab.active {
        border-bottom-color: #18a0fb;
        color: #ffffff;
      }

      .tab-body {
        padding: 12px;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      /* Cards & Buttons */
      .card {
        background: #252525;
        border: 1px solid #343434;
        border-radius: 8px;
        padding: 11px 12px;
        margin-bottom: 10px;
      }

      .card:last-child {
        margin-bottom: 0;
      }

      button.btn {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        margin: 0;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s, color 0.15s;
        white-space: nowrap;
      }

      button.btn-primary {
        background-color: #18a0fb;
        color: #ffffff;
      }

      button.btn-primary:hover {
        background-color: #0d8ee0;
      }

      button.btn-secondary {
        background-color: #373737;
        color: #e4e4e4;
      }

      button.btn-secondary:hover {
        background-color: #464646;
      }

      button.btn:disabled {
        background-color: #333333;
        color: #666666;
        cursor: not-allowed;
      }

      button.btn-sm {
        padding: 5px 9px;
        font-size: 11px;
      }

      button.btn-full {
        width: 100%;
      }

      /* Tab 1: Hero Connection Card */
      .hero-card {
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid;
      }

      .hero-card.connected {
        background: #1b2820;
        border-color: #2d6242;
      }

      .hero-card.waiting {
        background: #282217;
        border-color: #63491d;
      }

      .hero-card.disconnected {
        background: #2b1a1a;
        border-color: #692c2c;
      }

      .hero-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .hero-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
      }

      .hero-card.connected .hero-title {
        color: #8ce9ad;
      }

      .hero-card.waiting .hero-title {
        color: #f6c46a;
      }

      .hero-card.disconnected .hero-title {
        color: #ff9c9c;
      }

      .doc-meta-box {
        background: rgba(0, 0, 0, 0.24);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 6px;
        padding: 7px 9px;
        margin-bottom: 9px;
        font-size: 11.5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .doc-label {
        color: #9ba8a0;
        flex-shrink: 0;
      }

      .doc-name {
        color: #f3f3f3;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .hero-sub {
        font-size: 11.5px;
        line-height: 1.5;
        color: #d0d0d0;
        margin: 0 0 10px 0;
      }

      /* Workflow / Numbered Steps */
      .flow-steps {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .flow-step {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 11.5px;
        line-height: 1.5;
        color: #d2d2d2;
      }

      .flow-num {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(24, 160, 251, 0.18);
        color: #7cc4ff;
        font-size: 11px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        margin-top: 1px;
      }

      /* Collapsible Advanced Settings in Tab 1 */
      details.adv-details {
        background: #212121;
        border: 1px solid #303030;
        border-radius: 8px;
        margin-bottom: 10px;
        overflow: hidden;
      }

      details.adv-details > summary {
        list-style: none;
        cursor: pointer;
        padding: 9px 11px;
        font-size: 11.5px;
        font-weight: 500;
        color: #9e9e9e;
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
      }

      details.adv-details > summary::-webkit-details-marker {
        display: none;
      }

      details.adv-details > summary:hover {
        color: #dcdcdc;
        background: rgba(255, 255, 255, 0.025);
      }

      details.adv-details > summary::after {
        content: "▸";
        font-size: 11px;
        color: #777777;
        transition: transform 0.15s;
      }

      details.adv-details[open] > summary::after {
        transform: rotate(90deg);
      }

      .adv-body {
        padding: 10px 11px 11px;
        border-top: 1px solid #2d2d2d;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .adv-sub-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #1a1a1a;
        border: 1px solid #2f2f2f;
        border-radius: 6px;
        padding: 6px 8px;
      }

      .adv-kv {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .adv-k {
        font-size: 11px;
        color: #8c8c8c;
      }

      .adv-v {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        color: #e4e4e4;
        letter-spacing: 0.04em;
        user-select: all;
      }

      .link-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .port-input-wrap {
        flex: 1;
        display: flex;
        align-items: center;
        background: #282828;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0 9px;
      }

      .port-input-prefix {
        font-size: 11px;
        color: #8a8a8a;
        margin-right: 6px;
        white-space: nowrap;
      }

      .port-input {
        width: 100%;
        border: none;
        background: transparent;
        color: #e5e5e5;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 6px 0;
        outline: none;
      }

      .port-input:disabled {
        color: #7c7c7c;
        cursor: not-allowed;
      }

      .muted-note {
        font-size: 10.5px;
        color: #828282;
        line-height: 1.45;
      }

      /* Tab 2: Quick Prompts */
      .detect-banner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 7px;
        background: #202833;
        border: 1px solid #2e4866;
        margin-bottom: 10px;
        font-size: 12px;
        font-weight: 500;
        color: #d6e9ff;
      }

      .detect-banner-inner {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .accordion-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .acc-card {
        background: #252525;
        border: 1px solid #343434;
        border-radius: 8px;
        overflow: hidden;
        transition: border-color 0.15s;
      }

      .acc-card.is-recommended {
        border-color: #2f5b78;
      }

      .acc-card.is-open {
        border-color: #464646;
      }

      .acc-card.is-recommended.is-open {
        border-color: #18a0fb;
      }

      .acc-header {
        width: 100%;
        border: none;
        background: transparent;
        color: #f0f0f0;
        padding: 10px 11px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        text-align: left;
      }

      .acc-header:hover {
        background: rgba(255, 255, 255, 0.03);
      }

      .acc-header-left {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .acc-index {
        font-size: 10.5px;
        font-weight: 700;
        color: #9e9e9e;
        background: #313131;
        width: 18px;
        height: 18px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .acc-card.is-recommended .acc-index,
      .acc-index.is-rec {
        background: rgba(24, 160, 251, 0.2);
        color: #7cc4ff;
      }

      .acc-title {
        font-size: 12.5px;
        font-weight: 600;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .acc-header-right {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .tag {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
        white-space: nowrap;
      }

      .tag-low {
        background: #303030;
        color: #a6a6a6;
      }

      .tag-warn {
        background: #3d2d14;
        color: #f6c46a;
      }

      .tag-hot {
        background: #1a3d27;
        color: #7ee2a3;
      }

      .tag-debug {
        background: #3a2323;
        color: #fca5a5;
      }

      .acc-chevron {
        font-size: 11px;
        color: #888888;
        transition: transform 0.15s;
      }

      .acc-card.is-open .acc-chevron {
        transform: rotate(90deg);
        color: #cccccc;
      }

      .acc-body {
        display: none;
        padding: 0 11px 11px 11px;
        border-top: 1px solid #303030;
      }

      .acc-card.is-open .acc-body {
        display: block;
      }

      .acc-desc {
        margin: 8px 0 8px 0;
        font-size: 11px;
        line-height: 1.45;
        color: #b4b4b4;
      }

      textarea.prompt-box {
        width: 100%;
        background: #1d1d1d;
        color: #e4e4e4;
        padding: 8px 9px;
        border: 1px solid #383838;
        border-radius: 6px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
        font-size: 11.5px;
        line-height: 1.5;
        resize: none;
        display: block;
        margin-bottom: 8px;
      }

      .notice-card {
        background: #222222;
        border: 1px solid #333333;
        border-radius: 8px;
        padding: 10px 11px;
        margin-bottom: 10px;
      }

      .notice-card h2 {
        margin: 0 0 7px 0;
        font-size: 12px;
        font-weight: 600;
        color: #e6e6e6;
      }

      .notice-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .notice-item {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        font-size: 11px;
        line-height: 1.45;
        color: #b5b5b5;
      }

      .notice-dot {
        color: #7cc4ff;
        font-weight: 700;
        flex: 0 0 auto;
      }

      /* Tab 3: About */
      .meta-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid #343434;
        font-size: 12px;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .meta-key {
        color: #999999;
      }

      .meta-val {
        color: #ececec;
        font-weight: 500;
      }

      .link {
        color: #4db5ff;
        text-decoration: none;
        cursor: pointer;
      }

      .link:hover {
        text-decoration: underline;
      }

      /* Progress styles */
      .operation-complete {
        color: #4ade80;
      }
      .operation-error {
        color: #ff9999;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="topbar">
        <div class="topbar-left">
          <span id="status-dot" class="status-dot waiting"></span>
          <span class="brand">Agent to Figma</span>
          <span id="collapsed-status" class="collapsed-status"></span>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn active" data-lang="zh">中文</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <button type="button" id="btn-hide" class="hide-btn" data-i18n="hide">
            隐藏
          </button>
          <button type="button" id="btn-collapse" class="icon-btn" title="折叠">
            −
          </button>
        </div>
      </div>

      <div class="tabs">
        <div id="tab-connection" class="tab active" data-i18n="tabStatus">
          连接状态
        </div>
        <div id="tab-prompts" class="tab" data-i18n="tabPrompts">快捷指令</div>
        <div id="tab-about" class="tab" data-i18n="tabAbout">关于</div>
      </div>

      <div class="tab-body">
        <!-- Tab 1: Connection Status -->
        <div id="content-connection" class="tab-content active">
          <div id="hero-card" class="hero-card waiting">
            <div class="hero-head">
              <div class="hero-title">
                <span id="hero-dot" class="status-dot waiting"></span>
                <span id="hero-title-text"></span>
              </div>
            </div>
            <div class="doc-meta-box">
              <span class="doc-label" data-i18n="docLabel">当前画布</span>
              <span id="hero-doc-name" class="doc-name">—</span>
            </div>
            <p id="hero-sub" class="hero-sub"></p>
            <button
              type="button"
              id="btn-jump-prompts"
              class="btn btn-primary btn-full"
              data-i18n="goToPrompts"
            >
              前往「快捷指令」复制提示词 →
            </button>
          </div>

          <div class="card">
            <h2 data-i18n="flowTitle">使用流程</h2>
            <div class="flow-steps">
              <div class="flow-step">
                <span class="flow-num">1</span>
                <span data-i18n="flow1"></span>
              </div>
              <div class="flow-step">
                <span class="flow-num">2</span>
                <span data-i18n="flow2"></span>
              </div>
              <div class="flow-step">
                <span class="flow-num">3</span>
                <span data-i18n="flow3"></span>
              </div>
              <div class="flow-step">
                <span class="flow-num">4</span>
                <span data-i18n="flow4"></span>
              </div>
            </div>
          </div>

          <div class="notice-card">
            <h2 data-i18n="noticeTitle">注意事项</h2>
            <div class="notice-list">
              <div class="notice-item">
                <span class="notice-dot">•</span>
                <span data-i18n="notice1"></span>
              </div>
              <div class="notice-item">
                <span class="notice-dot">•</span>
                <span data-i18n="notice2"></span>
              </div>
              <div class="notice-item">
                <span class="notice-dot">•</span>
                <span data-i18n="notice3"></span>
              </div>
            </div>
          </div>

          <details id="adv-details" class="adv-details">
            <summary data-i18n="advTitle">
              高级设置（频道号 / 端口 / 手动连接）
            </summary>
            <div class="adv-body">
              <div id="adv-channel-wrap" class="hidden">
                <div class="adv-sub-row">
                  <div class="adv-kv">
                    <span class="adv-k" data-i18n="advChannelLabel">频道号</span>
                    <span id="channel-code" class="adv-v">—</span>
                  </div>
                  <button
                    type="button"
                    id="btn-copy-channel"
                    class="btn btn-secondary btn-sm"
                    data-i18n="copyChannel"
                  >
                    复制
                  </button>
                </div>
                <div
                  class="muted-note"
                  style="margin-top: 4px"
                  data-i18n="advChannelHint"
                ></div>
              </div>

              <div>
                <div class="link-row">
                  <div class="port-input-wrap">
                    <span class="port-input-prefix" data-i18n="portPrefix"
                      >端口</span
                    >
                    <input
                      type="number"
                      id="port"
                      class="port-input"

      let currentLang = "zh";
      try {
        const savedLang = localStorage.getItem("agentToFigma.lang");
        if (savedLang === "zh" || savedLang === "en") currentLang = savedLang;
      } catch (e) {
        // localStorage may be unavailable in some sandboxes
      }

      function t(key, vars) {
        const table = I18N[currentLang] || I18N.zh;
        let value = table[key];
        if (value === undefined) value = I18N.zh[key] || key;
        if (vars) {
          for (const [name, replacement] of Object.entries(vars)) {
            value = value.split(`{${name}}`).join(String(replacement));
          }
        }
        return value;
      }

      // WebSocket connection state
      const state = {
        connected: false,
        socket: null,
        serverPort: 3055,
        pendingRequests: new Map(),
        channel: null,
        docName: "",
        pageName: "",
        commandTracking: new Map(),
        reconnectTimer: null,
        manualDisconnect: false,
        collapsed: false,
        lastErrorMsg: "",
        lastPhase: null,
        openAccId: "cold",
        collapsedCopyResetTimer: null,
      };

      // UI Elements
      const portInput = document.getElementById("port");
      const connectButton = document.getElementById("btn-connect");
      const copyChannelButton = document.getElementById("btn-copy-channel");
      const channelCodeEl = document.getElementById("channel-code");
      const advChannelWrap = document.getElementById("adv-channel-wrap");
      const portHintEl = document.getElementById("port-hint");

      const heroCard = document.getElementById("hero-card");
      const heroDot = document.getElementById("hero-dot");
      const heroTitleText = document.getElementById("hero-title-text");
      const heroDocName = document.getElementById("hero-doc-name");
      const heroSub = document.getElementById("hero-sub");
      const detectBannerInner = document.getElementById("detect-banner-inner");

      // Tabs
      const tabs = document.querySelectorAll(".tab");
      const tabContents = document.querySelectorAll(".tab-content");

      // Progress elements
      const progressContainer = document.getElementById("progress-container");
      const progressBar = document.getElementById("progress-bar");
      const progressMessage = document.getElementById("progress-message");
      const progressStatus = document.getElementById("progress-status");
      const progressPercentage = document.getElementById("progress-percentage");

      function getTargetPort() {
        const parsed = parseInt(portInput.value, 10);
        if (parsed >= 1024 && parsed <= 65535) return parsed;
        return state.serverPort || 3055;
      }

      function getLinkPhase() {
        if (state.connected) return "connected";
        if (state.manualDisconnect) return "disconnected";
        return "waiting";
      }

      function getRecommendedInfo(phase) {
        if (phase === "connected") return { id: "work", num: "4" };
        if (phase === "waiting") return { id: "cold", num: "2" };
        return { id: "debug", num: "5" };
      }

      function switchToTab(tabId) {
        tabs.forEach((tab) => {
          tab.classList.toggle("active", tab.id === tabId);
        });
        const map = {
          "tab-connection": "content-connection",
          "tab-prompts": "content-prompts",
          "tab-about": "content-about",
        };
        const targetContentId = map[tabId];
        tabContents.forEach((content) => {
          content.classList.toggle("active", content.id === targetContentId);
        });
        if (tabId === "tab-prompts") {
          const rec = getRecommendedInfo(getLinkPhase());
          state.openAccId = rec.id;
          renderAccordionState();
        }
      }

      function renderAccordionState() {
        const phase = getLinkPhase();
        const rec = getRecommendedInfo(phase);
        if (detectBannerInner) {
          detectBannerInner.innerHTML = t("detectBanner", { num: rec.num });
        }
        document.querySelectorAll("#accordion-list .acc-card").forEach((card) => {
          const id = card.getAttribute("data-acc");
          card.classList.toggle("is-recommended", id === rec.id);
          card.classList.toggle("is-open", id === state.openAccId);
        });
      }

      function renderStatus() {
        const phase = getLinkPhase();
        const phaseChanged = state.lastPhase !== phase;
        state.lastPhase = phase;

        if (phaseChanged) {
          state.openAccId = getRecommendedInfo(phase).id;
        }

        // Topbar dot & collapsed status
        const dot = document.getElementById("status-dot");
        if (dot) {
          dot.className = `status-dot ${phase}`;
        }

        const collapsedStatus = document.getElementById("collapsed-status");
        if (collapsedStatus) {
          const canCopy = !!(state.connected && state.channel);
          collapsedStatus.textContent = state.connected
            ? state.channel || t("collapsedConnected")
            : t("collapsedDisconnected");
          collapsedStatus.classList.toggle("copyable", canCopy);
          collapsedStatus.title = canCopy
            ? t("collapsedCopyTitle", { channel: state.channel })
            : "";
        }

        // Hero card
        if (heroCard) {
          heroCard.className = `hero-card ${phase}`;
        }
        if (heroDot) {
          heroDot.className = `status-dot ${phase}`;
        }
        if (heroTitleText) {
          heroTitleText.textContent =
            phase === "connected"
              ? t("heroConnectedTitle")
              : phase === "waiting"
              ? t("heroWaitingTitle")
              : t("heroDisconnectedTitle");
        }
        if (heroDocName) {
          const doc = state.docName ? state.docName.trim() : "";
          heroDocName.textContent = doc || t("untitledDoc");
          heroDocName.title = doc || "";
        }
        if (heroSub) {
          heroSub.textContent =
            phase === "connected"
              ? t("heroConnectedSub")
              : phase === "waiting"
              ? t("heroWaitingSub")
              : t("heroDisconnectedSub");
        }

        // Advanced settings (channel + port + manual connect)
        const showChannel = !!(state.connected && state.channel);
        if (advChannelWrap) {
          advChannelWrap.classList.toggle("hidden", !showChannel);
        }
        if (channelCodeEl) {
          channelCodeEl.textContent = showChannel ? state.channel : "—";
        }

        connectButton.textContent = state.connected
          ? t("disconnectBtn")
          : t("reconnectBtn");
        portInput.disabled = state.connected;
        if (portHintEl) {
          portHintEl.textContent = state.connected
            ? t("portHintConnected")
            : t("portHintIdle");
        }

        renderAccordionState();
        updateAllPrompts();
      }

      function syncStatusToPlugin() {
        parent.postMessage(
          {
            pluginMessage: {
              type: "sync-status",
              connected: state.connected,
              channel: state.channel,
              lang: currentLang,
            },
          },
          "*"
        );
      }

      function updateConnectionState(isConnected, errorMsg) {
        state.connected = isConnected;
        if (errorMsg !== undefined) {
          state.lastErrorMsg = errorMsg || "";
        } else if (isConnected) {
          state.lastErrorMsg = "";
        }
        renderStatus();
        syncStatusToPlugin();
      }

      function updateAllPrompts() {
        const kinds = ["setup", "cold", "hot", "work", "debug", "exit"];
        for (const kind of kinds) {
          const el = document.getElementById(`prompt-${kind}`);
          if (!el) continue;
          const next = buildPrompt(kind);
          if (el.value !== next) {
            el.value = next;
          }
        }
      }

      function applyLanguage() {
        document.documentElement.lang = currentLang === "zh" ? "zh-CN" : "en";
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.getAttribute("data-i18n"));
        });
        document.querySelectorAll("[data-i18n-html]").forEach((el) => {
          el.innerHTML = t(el.getAttribute("data-i18n-html"));
        });
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.lang === currentLang);
        });
        const collapseBtn = document.getElementById("btn-collapse");
        if (collapseBtn) {
          collapseBtn.title = t(state.collapsed ? "expand" : "collapse");
        }
        const hideBtn = document.getElementById("btn-hide");
        if (hideBtn) {
          hideBtn.title = t("hideTitle");
        }
        renderStatus();
        syncStatusToPlugin();
      }

      const WINDOW_WIDTH = 360;
      const EXPANDED_HEIGHT = 600;
      const COLLAPSED_WIDTH = 212;
      const COLLAPSED_HEIGHT = 44;

      function setCollapsed(collapsed) {
        state.collapsed = collapsed;
        document.body.classList.toggle("collapsed", collapsed);
        const collapseBtn = document.getElementById("btn-collapse");
        if (collapseBtn) {
          collapseBtn.textContent = collapsed ? "+" : "−";
          collapseBtn.title = t(collapsed ? "expand" : "collapse");
        }
        parent.postMessage(
          {
            pluginMessage: {
              type: "resize-ui",
              width: collapsed ? COLLAPSED_WIDTH : WINDOW_WIDTH,
              height: collapsed ? COLLAPSED_HEIGHT : EXPANDED_HEIGHT,
            },
          },
          "*"
        );
      }

      // Connect to WebSocket server
      async function connectToServer(port) {
        try {
          const targetPort =
            Number(port) > 0 ? Number(port) : state.serverPort || 3055;

          if (
            state.socket &&
            (state.socket.readyState === WebSocket.OPEN ||
              state.socket.readyState === WebSocket.CONNECTING)
          ) {
            updateConnectionState(true, "");
            return;
          }

          clearTimeout(state.reconnectTimer);
          state.manualDisconnect = false;
          state.serverPort = targetPort;
          const wsUrl = `ws://localhost:${targetPort}`;

          const socket = new WebSocket(wsUrl);
          state.socket = socket;

          socket.onopen = () => {
            if (state.socket !== socket) return;
            const channelName = state.channel || generateChannelName();
            console.log("Joining channel:", channelName);
            state.channel = channelName;

            socket.send(
              JSON.stringify({
                type: "join",
                channel: channelName.trim(),
                role: "plugin",
                meta: {
                  docName: state.docName || "",
                  pageName: state.pageName || "",
                },
              })
            );
          };

          socket.onmessage = (event) => {
            if (state.socket !== socket) return;
            try {
              const data = JSON.parse(event.data);
              console.log("Received message:", data);

              if (data.type === "system") {
                if (data.message && data.message.result) {
                  state.connected = true;
                  state.channel = data.channel;
                  updateConnectionState(true, "");
                  parent.postMessage(
                    {
                      pluginMessage: {
                        type: "notify",
                        message: t("notifyConnected", {
                          port: targetPort,
                          channel: data.channel,
                        }),
                      },
                    },
                    "*"
                  );
                }
              } else if (data.type === "error") {
                console.error("Error:", data.message);
                updateConnectionState(false, String(data.message || ""));
                socket.close();
              }

              handleSocketMessage(data);
            } catch (error) {
              console.error("Error parsing message:", error);
            }
          };

          socket.onclose = () => {
            if (state.socket !== socket) return;
            state.socket = null;
            updateConnectionState(false);
            scheduleReconnect();
          };

          socket.onerror = (error) => {
            console.error("WebSocket error:", error);
            if (state.socket !== socket) return;
            updateConnectionState(false, "WebSocket error");
          };
        } catch (error) {
          console.error("Connection error:", error);
          updateConnectionState(false, error.message || t("unknownError"));
        }
      }

      // Retry after a short delay unless the user disconnected on purpose.
      function scheduleReconnect() {
        if (state.manualDisconnect) return;
        clearTimeout(state.reconnectTimer);
        state.reconnectTimer = setTimeout(() => {
          if (!state.manualDisconnect && !state.connected) {
            connectToServer(getTargetPort());
          }
        }, 2000);
      }

      // Disconnect from websocket server
      function disconnectFromServer() {
        state.manualDisconnect = true;
        clearTimeout(state.reconnectTimer);
        if (state.socket) {
          const socket = state.socket;
          state.socket = null;
          socket.close();
        }
        updateConnectionState(false, "");
      }

      // Handle messages from the WebSocket
      async function handleSocketMessage(payload) {
        const data = payload.message;
        console.log("handleSocketMessage", data);

        if (data.id && state.pendingRequests.has(data.id)) {
          const { resolve, reject } = state.pendingRequests.get(data.id);
          state.pendingRequests.delete(data.id);

          if (data.error) {
            reject(new Error(data.error));
          } else {
            resolve(data.result);
          }
          return;
        }

        if (data.command) {
          try {
            state.activeRequestId = data.id;
            state.commandTracking.set(data.id, {
              command: data.command,
              startedAt: Date.now(),
            });

            parent.postMessage(
              {
                pluginMessage: {
                  type: "execute-command",
                  id: data.id,
                  command: data.command,
                  params: data.params,
                },
              },
              "*"
            );
          } catch (error) {
            sendErrorResponse(
              data.id,
              error.message || "Error executing command"
            );
          }
        }
      }

      function trackCommandResult(id, success, errorMessage) {
        const meta = state.commandTracking.get(id);
        if (!meta) return;
        state.commandTracking.delete(id);
        const params = {
          command_name: String(meta.command || "unknown"),
          success: success ? 1 : 0,
          duration_ms: Date.now() - meta.startedAt,
        };
        if (!success && errorMessage) {
          params.error_message = String(errorMessage).slice(0, 100);
        }
      }

      async function sendCommand(command, params) {
        return new Promise((resolve, reject) => {
          if (!state.connected || !state.socket) {
            reject(new Error("Not connected to server"));
            return;
          }

          const id = generateId();
          state.pendingRequests.set(id, { resolve, reject });

          state.socket.send(
            JSON.stringify({
              id,
              type: "message",
              channel: state.channel,
              message: {
                id,
                command,
                params,
              },
            })
          );

          setTimeout(() => {
            if (state.pendingRequests.has(id)) {
              state.pendingRequests.delete(id);
              reject(new Error("Request timed out"));
            }
          }, 30000);
        });
      }

      function sendSuccessResponse(id, result) {
        if (!state.connected || !state.socket) {
          console.error("Cannot send response: socket not connected");
          return;
        }

        state.socket.send(
          JSON.stringify({
            id,
            type: "message",
            channel: state.channel,
            message: {
              id,
              result,
            },
          })
        );
      }

      function sendErrorResponse(id, errorMessage) {
        if (!state.connected || !state.socket) {
          console.error("Cannot send error response: socket not connected");
          return;
        }

        state.socket.send(
          JSON.stringify({
            id,
            type: "message",
            channel: state.channel,
            message: {
              id,
              error: errorMessage,
              result: {},
            },
          })
        );
      }

      function generateId() {
        return (
          Date.now().toString(36) + Math.random().toString(36).substr(2, 5)
        );
      }

      function generateChannelName() {
        const characters = "abcdefghijklmnopqrstuvwxyz0123456789";
        let result = "";
        for (let i = 0; i < 8; i++) {
          result += characters.charAt(
            Math.floor(Math.random() * characters.length)
          );
        }
        return result;
      }

      // Tab switching
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          switchToTab(tab.id);
        });
      });

      // Jump from Tab 1 hero CTA to Tab 2 Quick Prompts
      document
        .getElementById("btn-jump-prompts")
        .addEventListener("click", () => {
          switchToTab("tab-prompts");
        });

      // Connect / Disconnect button inside Advanced Settings
      connectButton.addEventListener("click", () => {
        if (state.connected) {
          disconnectFromServer();
        } else {
          connectToServer(getTargetPort());
        }
      });

      // Accordion toggle in Tab 2
      document
        .getElementById("accordion-list")
        .addEventListener("click", (event) => {
          const toggle = event.target.closest("[data-acc-toggle]");
          if (toggle) {
            const id = toggle.getAttribute("data-acc-toggle");
            state.openAccId = state.openAccId === id ? null : id;
            renderAccordionState();
            return;
          }

          const copyBtn = event.target.closest("[data-copy-prompt]");
          if (copyBtn) {
            const kind = copyBtn.getAttribute("data-copy-prompt");
            const txt = buildPrompt(kind);
            copyPlainText(txt);
            const labelMap = {
              setup: "c1Btn",
              cold: "c2Btn",
              hot: "c3Btn",
              work: "c4Btn",
              debug: "c5Btn",
              exit: "c6Btn",
            };
            copyBtn.textContent = t("copied");
            setTimeout(() => {
              copyBtn.textContent = t(labelMap[kind]);
            }, 2000);
          }
        });

      function updateProgressUI(progressData) {
        progressContainer.classList.remove("hidden");

        const progress = progressData.progress || 0;
        progressBar.style.width = `${progress}%`;
        progressPercentage.textContent = `${progress}%`;

        progressMessage.textContent =
          progressData.message || t("operationInProgress");

        if (progressData.status === "started") {
          progressStatus.textContent = t("started");
          progressStatus.className = "";
        } else if (progressData.status === "in_progress") {
          progressStatus.textContent = t("inProgress");
          progressStatus.className = "";
        } else if (progressData.status === "completed") {
          progressStatus.textContent = t("completed");
          progressStatus.className = "operation-complete";

          setTimeout(() => {
            progressContainer.classList.add("hidden");
          }, 5000);
        } else if (progressData.status === "error") {
          progressStatus.textContent = t("error");
          progressStatus.className = "operation-error";
        }
      }

      function sendProgressUpdateToServer(progressData) {
        if (!state.connected || !state.socket) {
          console.error("Cannot send progress update: socket not connected");
          return;
        }

        console.log("Sending progress update to server:", progressData);

        const requestId = state.activeRequestId || progressData.commandId;
        state.socket.send(
          JSON.stringify({
            id: requestId,
            type: "progress_update",
            channel: state.channel,
            message: {
              id: requestId,
              type: "progress_update",
              data: progressData,
            },
          })
        );
      }

      // Listen for messages from the plugin code
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        console.log("Received message from plugin:", message);

        switch (message.type) {
          case "document-meta":
            state.docName = message.docName || "";
            state.pageName = message.pageName || "";
            renderStatus();
            if (
              state.connected &&
              state.socket &&
              state.socket.readyState === WebSocket.OPEN &&
              state.channel
            ) {
              state.socket.send(
                JSON.stringify({
                  type: "update_meta",
                  channel: state.channel,
                  meta: {
                    docName: state.docName,
                    pageName: state.pageName,
                  },
                })
              );
            }
            break;
          case "connection-status":
            updateConnectionState(
              !!message.connected,
              message.connected ? "" : message.message || ""
            );
            break;
          case "ui-visibility":
            if (message.visible && state.collapsed) {
              setCollapsed(false);
            }
            break;
          case "auto-connect":
            if (!state.connected) {
              connectToServer(getTargetPort());
            }
            break;
          case "auto-disconnect":
            if (state.connected) {
              disconnectFromServer();
            }
            break;
          case "command-result":
            sendSuccessResponse(message.id, message.result);
            trackCommandResult(message.id, true);
            break;
          case "command-error":
            sendErrorResponse(message.id, message.error);
            trackCommandResult(message.id, false, message.error);
            break;
          case "command_progress":
            updateProgressUI(message);
            sendProgressUpdateToServer(message);
            break;
        }
      };

      function copyPlainText(text) {
        if (!text) return false;
        const temp = document.createElement("textarea");
        temp.value = text;
        temp.setAttribute("readonly", "");
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (e) {
          ok = false;
        }
        document.body.removeChild(temp);
        if (!ok && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
          ok = true;
        }
        return ok;
      }

      // Copy active channel name inside Advanced Settings
      if (copyChannelButton) {
        copyChannelButton.addEventListener("click", () => {
          if (!state.channel) return;
          copyPlainText(state.channel);
          copyChannelButton.textContent = t("copied");
          setTimeout(() => {
            copyChannelButton.textContent = t("copyChannel");
          }, 2000);
        });
      }

      // Click collapsed status pill to copy channel directly without expanding
      const collapsedStatusEl = document.getElementById("collapsed-status");
      if (collapsedStatusEl) {
        collapsedStatusEl.addEventListener("click", () => {
          if (!state.connected || !state.channel) return;
          copyPlainText(state.channel);
          collapsedStatusEl.textContent = t("copied");
          clearTimeout(state.collapsedCopyResetTimer);
          state.collapsedCopyResetTimer = setTimeout(() => {
            renderStatus();
          }, 1500);
        });
      }

      // Keep prompts in sync when user edits port input
      portInput.addEventListener("input", () => {
        updateAllPrompts();
      });

      // Language switch
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const next = btn.dataset.lang === "en" ? "en" : "zh";
          if (next === currentLang) return;
          currentLang = next;
          try {
            localStorage.setItem("agentToFigma.lang", currentLang);
          } catch (e) {
            // ignore storage failures
          }
          applyLanguage();
        });
      });

      // Hide plugin window to background (keeps WebSocket alive; shows persistent bottom bar)
      document.getElementById("btn-hide").addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "hide-ui" } }, "*");
      });

      // Collapse / expand the plugin window
      document.getElementById("btn-collapse").addEventListener("click", () => {
        setCollapsed(!state.collapsed);
      });

      // Apply the saved language on load and notify code.js that UI is ready
      applyLanguage();
      parent.postMessage(
        { pluginMessage: { type: "ui-ready", lang: currentLang } },
        "*"
      );
    </script>
  </body>
</html>
